<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أكاديمية التميز</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{background:#0f172a;color:#f8fafc;font-family:system-ui}.glass-panel{background:rgba(30,41,59,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1)}</style>
</head>
<body class="min-h-screen flex flex-col justify-between">
<header class="glass-panel sticky top-0 z-50 py-4 px-6 mb-8"><div class="max-w-6xl mx-auto flex justify-between items-center"><div class="flex items-center gap-3"><i class="fa-solid fa-graduation-cap text-indigo-400 text-3xl"></i><h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">أكاديمية التميز</h1></div><span class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-full">توليد أسئلة بالذكاء الاصطناعي</span></div></header>
<main class="max-w-4xl mx-auto px-4 w-full flex-grow">
<div class="glass-panel rounded-2xl p-6 md:p-8 shadow-2xl mb-8">
<div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-6"><h2 class="text-xl font-semibold flex gap-2"><i class="fa-solid fa-robot text-cyan-400"></i> إنشاء أسئلة</h2><label class="cursor-pointer bg-slate-800 text-cyan-400 border border-cyan-500/30 px-4 py-2 rounded-xl text-sm flex gap-2"><i class="fa-solid fa-file-pdf"></i><span>استيراد PDF</span><input type="file" id="pdfInput" accept="application/pdf" class="hidden" onchange="handlePdfUpload(event)"></label></div>
<div id="pdfStatus" class="hidden mb-4 p-3 rounded-xl text-sm flex gap-2"></div>
<div class="mb-6"><label class="block text-sm text-slate-300 mb-2">النص / الموضوع:</label><textarea id="promptInput" rows="5" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-4 text-sm focus:border-indigo-500 outline-none" placeholder="أركان الإسلام، قواعد النحو... أو استورد PDF"></textarea></div>
<div class="mb-6 grid grid-cols-2 gap-4"><div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 text-center"><span class="block text-xs text-slate-400 mb-1">اختيار من متعدد</span><input type="number" id="mcqCount" min="0" max="10" value="2" class="w-full bg-slate-900 border border-slate-700 text-center py-1 rounded-lg text-indigo-400 font-bold"></div><div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 text-center"><span class="block text-xs text-slate-400 mb-1">صح أو خطأ</span><input type="number" id="tfCount" min="0" max="10" value="1" class="w-full bg-slate-900 border border-slate-700 text-center py-1 rounded-lg text-cyan-400 font-bold"></div></div>
<button id="generateBtn" onclick="generateQuestions()" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 font-bold py-3.5 rounded-xl flex justify-center gap-2"><i class="fa-solid fa-wand-magic-sparkles"></i><span>توليد الأسئلة الآن</span></button>
</div>
<div id="resultsSection" class="hidden glass-panel rounded-2xl p-6 md:p-8 shadow-2xl mb-12"><div class="flex justify-between border-b border-slate-700 pb-4 mb-6"><h3 class="font-semibold flex gap-2"><i class="fa-solid fa-list-check text-emerald-400"></i> الأسئلة (<span id="questionsCount">0</span>)</h3><button onclick="clearQuestions()" class="text-rose-400 text-xs bg-rose-500/10 px-3 py-1.5 rounded-lg border border-rose-500/20"><i class="fa-solid fa-trash"></i> مسح</button></div><div id="questionsContainer" class="space-y-4"></div></div>
</main>
<footer class="text-center py-6 text-slate-500 text-xs">© أكاديمية التميز 2026</footer>
<script>
let extractedPdfText="";
async function handlePdfUpload(e){const file=e.target.files[0];if(!file)return;const s=document.getElementById('pdfStatus');s.className="mb-4 p-3 rounded-xl text-sm flex gap-2 bg-indigo-500/20 border border-indigo-500/30 text-indigo-300";s.innerHTML=`<i class="fa-solid fa-spinner fa-spin"></i> جاري قراءة ${file.name}`;s.classList.remove('hidden');try{const b=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:b}).promise;let t="";for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const c=await p.getTextContent();t+=c.items.map(x=>x.str).join(' ')+"\n"}extractedPdfText=t.trim();document.getElementById('promptInput').value=extractedPdfText;s.className="mb-4 p-3 rounded-xl text-sm flex gap-2 bg-emerald-500/20 border border-emerald-500/30 text-emerald-300";s.innerHTML=`<i class="fa-solid fa-circle-check"></i> تم استخراج ${extractedPdfText.length} حرف`}catch(err){s.className="mb-4 p-3 rounded-xl text-sm flex gap-2 bg-rose-500/20 border border-rose-500/30 text-rose-300";s.innerHTML=`خطأ: ${err.message}`}}
async function generateQuestions(){const prompt=document.getElementById('promptInput').value.trim();const mcq=parseInt(document.getElementById('mcqCount').value)||0;const tf=parseInt(document.getElementById('tfCount').value)||0;const btn=document.getElementById('generateBtn');if(!prompt){alert('أدخل موضوع');return}btn.disabled=true;btn.innerHTML=`<i class="fa-solid fa-spinner fa-spin"></i> جاري التوليد...`;try{const r=await fetch('/.netlify/functions/generate-questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,counts:{MCQ:mcq,TF:tf}})});const d=await r.json();if(!r.ok)throw new Error(d.error);if(d.questions)renderQuestions(d.questions)}catch(e){alert(`خطأ: ${e.message}`)}finally{btn.disabled=false;btn.innerHTML=`<i class="fa-solid fa-wand-magic-sparkles"></i><span>توليد الأسئلة الآن</span>`}}
function renderQuestions(qs){const sec=document.getElementById('resultsSection');const cont=document.getElementById('questionsContainer');document.getElementById('questionsCount').innerText=qs.length;cont.innerHTML='';qs.forEach((q,i)=>{const card=document.createElement('div');card.className="bg-slate-800/80 border border-slate-700/80 rounded-xl p-4";let h=`<div class="text-sm font-semibold mb-2">${i+1}. ${q.textAr}</div>`;if(q.type==='MCQ'){h+=`<div class="grid md:grid-cols-2 gap-2">`;q.optionsAr.forEach((o,idx)=>{const ok=idx===q.correctOptionIndex;h+=`<div class="text-xs p-2.5 rounded-lg border ${ok?'bg-emerald-500/10 border-emerald-500/30 text-emerald-300':'bg-slate-900/60 border-slate-700/60 text-slate-400'}">${String.fromCharCode(65+idx)}) ${o} ${ok?'✓':''}</div>`});h+=`</div>`}else{h+=`<div class="mt-2 inline-block text-xs px-3 py-1.5 rounded-lg bg-cyan-500/10 border border-cyan-500/30 text-cyan-300">الإجابة: ${q.trueFalseAnswer?'صواب ✓':'خطأ ✗'}</div>`}card.innerHTML=h;cont.appendChild(card)});sec.classList.remove('hidden');sec.scrollIntoView({behavior:'smooth'})}
function clearQuestions(){document.getElementById('questionsContainer').innerHTML='';document.getElementById('resultsSection').classList.add('hidden')}
</script>
</body>
</html>
